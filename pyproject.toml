[project]
name = "pwc-one-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "mcp<2",
    "streamlit>=1.67.0",
    "pyyaml>=6.0.4",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.2.0",
    "python-dotenv>=1.2.4",
    "pandas>=3.1.1",
    "fastembed>=0.9.1",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "plugins", "mcp_servers"]
