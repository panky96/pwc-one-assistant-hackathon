# Infrastructure only. Set POSTGRES_PASSWORD in your local .env (never commit it).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pwc_one
      POSTGRES_USER: pwc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
